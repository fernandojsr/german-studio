<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇩🇪 German Studio - Learn German</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="flag">🇩🇪</span>
                <h2>German<span>Studio</span></h2>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-value" id="totalWords">0</span>
                    <span class="stat-label">Words</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="studiedCount">0</span>
                    <span class="stat-label">Studied</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="streakDays">0</span>
                    <span class="stat-label">Streak</span>
                </div>
            </div>
            
            <div class="topic-filter">
                <h3>Topics</h3>
                <div class="search-box">
                    <input type="text" id="topicSearch" placeholder="🔍 Search topics...">
                </div>
                <div class="topic-list" id="topicList"></div>
            </div>
            
            <div class="progress-section">
                <h3>Progress</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="progressPercent">0%</span>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Action buttons -->
            <div class="action-buttons">
                <button id="showGamesMenuBtn" class="games-menu-btn">🎮 Games</button>
                <button id="showTravelModeBtn" class="travel-mode-btn">✈️ Travel Mode</button>
                <button id="showCsvEditorBtn" class="editor-btn">📝 CSV Editor</button>
                <button id="shareProgressBtn" class="share-btn">📤 Share progress</button>
                <button id="showAddWordBtn" class="add-word-btn">➕ Add word</button>
                <button id="exportCsvBtn" class="export-btn">📥 Export to CSV</button>
                <button id="saveToFileBtn" class="save-file-btn">💾 Save changes</button>
            </div>
            
            <!-- Mode selector -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="study">📚 Study</button>
                <button class="mode-btn" data-mode="quiz">✏️ Practice</button>
                <button class="mode-btn" data-mode="dictionary">📖 Dictionary</button>
            </div>
            
            <!-- Dynamic content container -->
            <div id="dynamicContent" class="dynamic-content">
                <!-- Study Mode (Flashcards) -->
                <div id="studyMode" class="content-panel active">
                    <div class="card-container">
                        <div class="flashcard" id="flashcard">
                            <div class="card-inner">
                                <div class="card-front">
                                    <span class="card-topic" id="cardTopic"></span>
                                    <span class="card-article" id="cardArticle"></span>
                                    <div class="card-word" id="cardWord"></div>
                                    <div class="card-hint" id="cardHint">🖱️ Click to see the answer</div>
                                </div>
                                <div class="card-back">
                                    <span class="card-topic" id="backTopic"></span>
                                    <div class="card-translation" id="cardTranslation"></div>
                                    <div class="card-examples" id="cardExampleContainer" style="display: none;">
                                        <div class="card-example" id="cardExampleAleman"></div>
                                        <div class="card-example-english" id="cardExampleIngles"></div>
                                    </div>
                                    <div class="card-plural" id="cardPlural"></div>
                                    <div class="card-femenino-container" id="cardFemeninoContainer" style="display: none;">
                                        <div class="card-femenino" id="cardFemenino"></div>
                                    </div>
                                    <div class="card-hint">🖱️ Click to go back</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card-controls">
                            <button class="nav-btn" id="prevCard">◀ Previous</button>
                            <div class="difficulty-buttons">
                                <button class="diff-btn hard" id="hardBtn">❌ Hard</button>
                                <button class="diff-btn medium" id="mediumBtn">🔄 Repeat</button>
                                <button class="diff-btn easy" id="easyBtn">✅ Easy</button>
                            </div>
                            <button class="nav-btn" id="nextCard">Next ▶</button>
                        </div>
                        
                        <div class="card-info">
                            <span id="cardCounter"></span>
                            <button id="shuffleBtn" class="shuffle-btn">🎲 Shuffle</button>
                        </div>
                    </div>
                </div>

                <!-- Practice Mode (Quiz) -->
                <div id="quizMode" class="content-panel">
                    <div class="quiz-container">
                        <div class="quiz-header">
                            <span class="quiz-score" id="quizScore">0</span>
                            <span class="quiz-total" id="quizTotal">0</span>
                        </div>
                        <div class="quiz-question" id="quizQuestion"></div>
                        <div class="quiz-options" id="quizOptions"></div>
                        <button class="quiz-next" id="quizNext" style="display: none;">Next →</button>
                    </div>
                </div>

                <!-- Dictionary Mode -->
                <div id="dictionaryMode" class="content-panel">
                    <div class="dictionary-container">
                        <div class="dictionary-search">
                            <input type="text" id="dictSearch" placeholder="🔍 Search German word..." class="dict-search-input">
                            <select id="dictTopicFilter" class="dict-topic-filter">
                                <option value="">All topics</option>
                            </select>
                        </div>
                        <div class="dictionary-results" id="dictionaryResults"></div>
                    </div>
                </div>

                <!-- Games Panel -->
                <div id="gamesPanel" class="content-panel">
                    <div class="panel-header">
                        <h3>🎮 Games</h3>
                        <button id="closeGamesPanel" class="close-panel-btn">✖️ Close</button>
                    </div>
                    <div class="games-tabs">
                        <button class="game-tab active" data-game="hangman">🔤 Hangman</button>
                        <button class="game-tab" data-game="wordsearch">🔍 Word Search</button>
                    </div>
                    
                    <div id="hangmanGame" class="game-content active">
                        <div class="hangman-container">
                            <div class="hangman-drawing">
                                <pre id="hangmanCanvas">
   +---+
   |   |
       |
       |
       |
       |
=========</pre>
                            </div>
                            <div class="hangman-word">
                                <div id="hangmanWordDisplay" class="word-display"></div>
                                <div id="hangmanHint" class="hangman-hint-box"></div>
                                <div id="hangmanWrongLetters" class="hangman-wrong-letters"></div>
                                <div class="hangman-letters" id="hangmanLetters"></div>
                                <div class="hangman-message" id="hangmanMessage"></div>
                                <button id="newHangmanGame" class="game-btn">🎲 New word</button>
                            </div>
                        </div>
                    </div>
                    
                    <div id="wordsearchGame" class="game-content" style="display: none;">
                        <div class="wordsearch-container">
                            <div id="wordsearchGrid" class="wordsearch-grid"></div>
                            <div class="wordsearch-words" id="wordsearchWords"></div>
                            <button id="newWordsearch" class="game-btn">🎲 New puzzle</button>
                            <div id="wordsearchMessage" class="wordsearch-message"></div>
                        </div>
                    </div>
                </div>

                <!-- Travel Mode Panel -->
                <div id="travelModePanel" class="content-panel">
                    <div class="panel-header">
                        <h3>✈️ Travel Mode</h3>
                        <button id="closeTravelPanel" class="close-panel-btn">✖️ Close</button>
                    </div>
                    <div class="scenario-buttons">
                        <button class="scenario-btn" data-scenario="restaurant">🍽️ Restaurant</button>
                        <button class="scenario-btn" data-scenario="airport">✈️ Airport</button>
                        <button class="scenario-btn" data-scenario="hotel">🏨 Hotel</button>
                        <button class="scenario-btn" data-scenario="shopping">🛍️ Shopping</button>
                        <button class="scenario-btn" data-scenario="directions">🗺️ Directions</button>
                        <button class="scenario-btn" data-scenario="emergency">🚨 Emergency</button>
                    </div>
                    <div id="travelWordsContainer" class="travel-words-container"></div>
                </div>

                <!-- CSV Editor Panel -->
                <div id="csvEditorPanel" class="content-panel">
                    <div class="panel-header">
                        <h3>📝 CSV Editor</h3>
                        <button id="closeEditorPanel" class="close-panel-btn">✖️ Close</button>
                    </div>
                    <div class="editor-toolbar">
                        <input type="text" id="editorSearch" placeholder="🔍 Search word...">
                        <button id="saveCsvChanges" class="save-edit-btn">💾 Save changes</button>
                    </div>
                    <div id="csvEditorTable" class="editor-table-wrapper"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Word Form -->
    <div id="addWordForm" class="add-word-form" style="display: none;">
        <h3>➕ Add new word</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>German word *</label>
                <input type="text" id="newAleman" placeholder="Ex: der Hund">
            </div>
            <div class="form-group">
                <label>Article</label>
                <select id="newArticulo">
                    <option value="">-- Select --</option>
                    <option value="der">der (masculine)</option>
                    <option value="die">die (feminine)</option>
                    <option value="das">das (neuter)</option>
                    <option value="adjektiv">Adjective</option>
                    <option value="verb">Verb</option>
                    <option value="phrase">Phrase</option>
                </select>
            </div>
            <div class="form-group">
                <label>Translation *</label>
                <input type="text" id="newTraduccion" placeholder="Ex: dog">
            </div>
            <div class="form-group">
                <label>Topic</label>
                <input type="text" id="newTema" placeholder="Ex: Animals" list="temaList">
                <datalist id="temaList"></datalist>
            </div>
            <div class="form-group">
                <label>German example</label>
                <input type="text" id="newEjemplo" placeholder="Ex: Der Hund bellt laut.">
            </div>
            <div class="form-group">
                <label>English example</label>
                <input type="text" id="newEjemploIngles" placeholder="Ex: The dog barks loudly.">
            </div>
            <div class="form-group">
                <label>Plural</label>
                <input type="text" id="newPlural" placeholder="Ex: Hunde">
            </div>
            <div class="form-group">
                <label>Feminine</label>
                <input type="text" id="newFemenino" placeholder="Ex: Hündin">
            </div>
        </div>
        <div class="form-buttons">
            <button id="saveWordBtn" class="save-btn">💾 Save word</button>
            <button id="cancelAddWordBtn" class="cancel-btn">❌ Cancel</button>
        </div>
        <div id="formMessage" class="form-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
